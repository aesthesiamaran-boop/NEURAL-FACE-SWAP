<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Neural Face Swap by Scientific Tamil Nadu</title>
<style>
:root{--bg:#0d0f14;--panel:#151922;--line:#262c3a;--gold:#d4b06a;--gold2:#f1dba4;--txt:#e9e6df;--mut:#8c93a3}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#1b2133 0,var(--bg) 60%);color:var(--txt);font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:22px 36px 10px;display:flex;align-items:baseline;gap:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;letter-spacing:.5px;margin:0;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;color:transparent}
header span{color:var(--mut);font-size:13px;letter-spacing:2px;text-transform:uppercase}
main{flex:1;display:grid;grid-template-columns:330px 1fr;gap:24px;padding:12px 36px 28px;min-height:0}
aside{display:flex;flex-direction:column;gap:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:.18s}
.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px);box-shadow:0 8px 24px #0006}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:Georgia,serif;flex:none}
.btn small{display:block;color:var(--mut);font-size:12px;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{height:92px;border-radius:12px;border:1px dashed var(--line);background:#0f121a center/contain no-repeat;display:grid;place-items:center;color:var(--mut);font-size:12px}
.go{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1408;border:none;font-weight:600}
.go .n{border-color:#1a1408;color:#1a1408}.go small{color:#4b3d1a}
.opts{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:8px;padding:4px 4px}
.opts select,.opts input{accent-color:var(--gold)}
.opts select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
#status{font-size:13px;color:var(--gold);min-height:36px}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.bar b{font-family:Georgia,serif;font-weight:400;letter-spacing:1px}
#dl{padding:9px 18px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
#dl:disabled{opacity:.35;cursor:not-allowed}#dl:hover:not(:disabled){background:var(--gold);color:#1a1408}
#view{flex:1;display:grid;place-items:center;padding:18px;min-height:0;background:repeating-conic-gradient(#10131a 0 25%,#0d1016 0 50%) 0 0/24px 24px}
#view img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px #000a}
#ph{color:var(--mut);text-align:center;line-height:1.7}
footer{text-align:center;color:var(--mut);font-size:11px;padding:0 0 12px;letter-spacing:1px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<header><h1>Neural Face Swap</h1><span>by Scientific Tamil Nadu</span></header>
<main>
<aside>
  <button class="btn" id="bT"><div class="n">1</div><div>Upload Target Photo<small id="tN">Photo to be edited / repaired</small></div></button>
  <div class="thumb" id="tT">No target photo</div>
  <button class="btn" id="bS"><div class="n">2</div><div>Load Face Image<small id="sN">Clear, front-facing face</small></div></button>
  <div class="thumb" id="tS">No face image</div>
  <div class="opts">
    <label>Faces in target
      <select id="mode"><option value="all">Swap all faces</option><option value="main">Largest face only</option></select></label>
    <label><input type="checkbox" id="rest" checked> Restore &amp; sharpen faces (damaged photos)</label>
  </div>
  <button class="btn go" id="bG" disabled><div class="n">3</div><div>Convert Face Swap<small>Generate result</small></div></button>
  <div id="status"></div>
</aside>
<section>
  <div class="bar"><b>Output</b><button id="dl" disabled>Download PNG</button></div>
  <div id="view"><div id="ph">Your result will appear here.<br>Choose a target photo and a face image to begin.</div></div>
</section>
</main>
<footer>© Scientific Tamil Nadu · Use only with photos you have the right and consent to edit</footer>
<script>
const $=id=>document.getElementById(id);let T=null,S=null;
const name=p=>p.split(/[\\/]/).pop();
function setThumb(el,url){el.style.backgroundImage=`url("${url}")`;el.textContent='';}
function ready(){$('bG').disabled=!(T&&S);}
$('bT').onclick=async()=>{const r=await api.pick('Select target photo');if(!r)return;T=r;$('tN').textContent=name(r.path);setThumb($('tT'),r.url);ready();};
$('bS').onclick=async()=>{const r=await api.pick('Select face image');if(!r)return;S=r;$('sN').textContent=name(r.path);setThumb($('tS'),r.url);ready();};
api.onProgress(m=>{$('status').innerHTML='<span class="spin"></span>'+m;});
$('bG').onclick=async()=>{
  $('bG').disabled=$('bT').disabled=$('bS').disabled=true;$('dl').disabled=true;
  $('status').innerHTML='<span class="spin"></span>Starting engine…';
  const r=await api.swap({target:T.path,source:S.path,mode:$('mode').value,restore:$('rest').checked});
  $('bT').disabled=$('bS').disabled=false;ready();
  if(r.ok){$('view').innerHTML=`<img src="${r.url}">`;$('dl').disabled=false;$('status').textContent='Done ✓';}
  else{$('status').textContent='⚠ '+r.error;}
};
$('dl').onclick=async()=>{const r=await api.save();if(r.ok)$('status').textContent='Saved: '+r.path;};
</script></body></html>
